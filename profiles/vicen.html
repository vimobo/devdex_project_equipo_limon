<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mi página web</title>

    <link rel="stylesheet" href="./css/main.css">
    <link rel="stylesheet" href="./css/components.css">
</head>

<body>

    <header class="header">
        <div class="container">
            <h1 class="logo">Vicen</h1>

            <nav class="nav">
                <a href="#inicio">Inicio</a>
                <a href="#sobre-mi">Sobre mí</a>
                <a href="#contacto">Contacto</a>
            </nav>
        </div>
    </header>

    <main>

        <section id="inicio" class="hero">
            <div class="container">
                <h2>Bienvenido a mi perfil</h2>
                <p>
                    soy Vicenç y soy programador y músico.
                </p>

                <a href="#sobre-mi" class="button">
                    Saber más
                </a>
            </div>
        </section>

        <section id="sobre-mi" class="section">
            <div class="container">
                <h2>Sobre mí</h2>

                <div class="cards">

                    <article class="card">
                        <h3>Diseño</h3>
                        <p>
                            Conocimientos de Java.
                        </p>
                    </article>

                    <article class="card">
                        <h3>Desarrollo</h3>
                        <p>
                            Conocimientos avanzados de JavaScript.
                        </p>
                    </article>

                    <article class="card">
                        <h3>Proyectos</h3>
                        <p>
                            Diferentes proyectos y trabajos realizados.
                        </p>
                    </article>

                </div>
            </div>
        </section>

        <section id="contacto" class="section">
            <div class="container">
                <h2>Contacto</h2>

                <form class="form">

                    <input
                        type="text"
                        placeholder="Nombre"
                    >

                    <input
                        type="email"
                        placeholder="Correo electrónico"
                    >

                    <textarea
                        placeholder="Mensaje"
                        rows="5"
                    ></textarea>

                    <button type="submit" class="button">
                        Enviar
                    </button>

                </form>
            </div>
        </section>

    </main>

    <footer class="footer">
        <p>© 2026 Mi Web</p>
    </footer>

</body>
</html>
